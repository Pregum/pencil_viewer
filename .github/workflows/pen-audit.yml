name: Pencil design check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # 配布用バンドルはコミットしてある。ソースだけ直してビルドを忘れると
  # 利用側には古い挙動が配られるので、ここで作り直して差分が出たら落とす。
  bundle:
    name: Bundle is up to date
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build:action

      - name: Check for drift
        run: |
          if ! git diff --exit-code -- tools/pen-audit/dist; then
            echo "::error::tools/pen-audit/dist is stale. Run 'npm run build:action' and commit the result."
            exit 1
          fi

  # 自分のサンプルに対して実際に走らせる。サンプルはどれも ideal だけなので
  # カバレッジは低く出るが、min-coverage を設定していないので落ちない。
  design-check:
    name: Check sample .pen files
    runs-on: ubuntu-latest
    needs: bundle
    steps:
      - uses: actions/checkout@v5

      - uses: ./tools/pen-audit
        with:
          paths: public/samples/*.pen
          changed-only: 'false'
