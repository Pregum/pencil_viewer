name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 古い JS アクション(upload-pages-artifact が内部で呼ぶ upload-artifact 等)も
# Node 24 ランタイムで強制実行する。GitHub 公式が案内しているオプトイン手段。
# upstream が新しい SHA を取り込んだら不要になる。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# GitHub Pages への Deploy に必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時に複数の deploy が走らないように(古いものは待つ、実行中は中断しない)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # vite 8 / @vitejs/plugin-react 6 の engines は
          # ^20.19.0 || >=22.12.0。LTS の 22 に合わせる。
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 本番バンドルに載る依存だけを対象にする。dev 依存 (vite/vitest チェーン) の
      # 既知脆弱性は vite 5 -> 8 のメジャー更新が必要なため #67 で解消する。
      - name: Audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      # error のみを落とす。既存コードに 36 件の warn (React Compiler 系の
      # 新ルールと exhaustive-deps) が残っており、これらは #78 で段階的に
      # 潰してから --max-warnings=0 に締める。
      - name: Lint
        run: npm run lint

      # カバレッジ付きで走らせる。vite.config.ts の thresholds を
      # 下回ると失敗するので、テストを消して数値が落ちる変更に気づける。
      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const t = require('./coverage/coverage-summary.json').total;
              const row = (k) => \`| \${k} | \${t[k].pct}% | \${t[k].covered}/\${t[k].total} |\`;
              console.log('| metric | % | covered |');
              console.log('|---|---|---|');
              ['lines','statements','functions','branches'].forEach(k => console.log(row(k)));
            " >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        run: npm run build
        env:
          # Cloudflare Workers Share API — vars に未設定の fork では空文字になり、
          # isShareEnabled() が false を返すので Share ボタンは自動的に非表示になる
          VITE_SHARE_API_URL: ${{ vars.VITE_SHARE_API_URL }}
          VITE_AI_REVIEW_URL: ${{ vars.VITE_AI_REVIEW_URL }}
          # 共同編集 WebRTC シグナリングサーバー (wss://) — 未設定でも
          # 同一ブラウザのタブ間は BroadcastChannel で同期する
          VITE_COLLAB_SIGNALING: ${{ vars.VITE_COLLAB_SIGNALING }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    # PR では検証(build)のみ、main への push / 手動実行のときだけデプロイ
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
